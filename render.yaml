services:
  - type: web
    name: askql-backend
    runtime: python
    rootDir: backend
    pythonVersion: "3.12.9"
    buildCommand: pip install --no-cache-dir --prefer-binary -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
